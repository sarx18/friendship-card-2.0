<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffc3a0);
    overflow:hidden;
}

.card{
    width:420px;
    max-width:90%;
    max-height:90vh;
    overflow-y:auto;
    padding:35px;
    text-align:center;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    border-radius:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    color:white;
    z-index:2;
    animation:cardAppear 1s ease;
}

h1{
    font-size:32px;
    margin-bottom:18px;
    text-shadow:0 0 15px white;
}

p{
    font-size:18px;
    line-height:1.6;
}


button{
    margin-top:25px;
    padding:12px 30px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4d79;
    font-size:18px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 0 20px rgba(255,255,255,.6);
}
button:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px white;
}

#secret{
    display:none;
    margin-top:25px;
    font-size:17px;
    line height:1.8;
    animation:fade 1s ease;
}

@keyframes fade{
    from{opacity:0;}
    to{opacity:1;}
}

/* Floating Hearts */

.heart{
    position:absolute;
    bottom:-40px;
    color:#ff1744;
    animation:float linear infinite;
}

@keyframes float{

0%{
transform:translateY(0) scale(.6);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.4);
opacity:0;
}

}

</style>

</head>

<body>

<div class="card">

<h1>❤️ Happy Friendship Day ❤️</h1>


<button onclick="showMessage()">
Click for Surprise 🎁
</button>

<div id="secret">
Dear Best Friend,<br><br>

LAWDE HAI TUM <br>
Dhanyawaad</div>

</div>

<script>

// Floating Hearts

function createHeart(){

const heart=document.createElement("div");

heart.classList.add("heart");

heart.innerHTML="❤";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(20+Math.random()*30)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,250);


// Surprise Message

function showMessage(){

document.getElementById("secret").style.display="block";


}


// Simple Confetti

function confetti(){

for(let i=0;i<120;i++){

let c=document.createElement("div");

c.style.position="absolute";
c.style.width="8px";
c.style.height="8px";
c.style.background=`hsl(${Math.random()*360},100%,60%)`;
c.style.left=Math.random()*100+"vw";
c.style.top="-20px";
c.style.borderRadius="50%";
c.style.transition="4s linear";

document.body.appendChild(c);

setTimeout(()=>{

c.style.transform=`translateY(${window.innerHeight+100}px)
rotate(720deg)`;

},50);

setTimeout(()=>{

c.remove();

},4200);

}

}
</script>

</body>
</html>
